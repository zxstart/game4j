# game4j starter default configuration

# server
game4j.server.port=9000
# game4j.server.scan-package=com.game4j
# indexed: no runtime classpath scan (production); auto: indexed then scan fallback; scan: development only
game4j.server.controller-index-mode=auto

# cluster
game4j.cluster.enabled=true
game4j.cluster.name=game4j-cluster
# game4j.cluster.node-id=
game4j.cluster.node-type=game-server
game4j.cluster.host=127.0.0.1
game4j.cluster.hazelcast-port=5701
game4j.cluster.grpc-port=19090
# comma separated, e.g. 127.0.0.1:5701,127.0.0.1:5702
game4j.cluster.seed-members=
# member: each game server is a Hazelcast member; client: join a dedicated Hazelcast control plane
game4j.cluster.mode=member
# Limits only the asynchronous transition to READY; it never delays the game port listening.
game4j.cluster.ready-timeout-ms=10000
# admin dashboard (HTTP)
# plugin switch
game4j.plugin.cluster-dashboard.enabled=true
game4j.admin.enabled=true
game4j.admin.host=127.0.0.1
game4j.admin.port=18080
